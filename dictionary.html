<!DOCTYPE html>
<html>
  <head>
    <title>Dictionary</title>
    <link rel="stylesheet" href="dictionary.css">
  </head>
  <body>
    <div class="search">
      <input class="js-input input" type="text" placeholder="Enter your word">
      <button class="js-button button">Go!</button>
    </div>
    <div class="align">
      <p class="js-response">
        <p class="white definition"></p>
        <p class="yellow example"></p>
        <p class="white definition2"></p>
        <p class="yellow example2"></p>
        <p class="white definition3"></p>
        <p class="yellow example3"></p>
      </p>
    </div>
    <script src="dictionary.js"></script>
  </body>
</html>
